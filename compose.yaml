# Shared Docker Compose file for all subprojects.
# Every subproject points spring.docker.compose.file here and connects to the same MySQL instance.
services:
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=outbox
      - MYSQL_USER=myuser
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=verysecret
    ports:
      - '127.0.0.1:3306:3306'
